# Hourly data update: fetch matches, settle bets, refresh odds, place new bets.
# Runs separately from the website so it keeps working while a free web host sleeps.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL, API_KEY, ODDS_API_KEY, GROQ_API_KEY
name: Update matches

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (GitHub cron runs in UTC and can be a few minutes late)
  workflow_dispatch:         # allows a manual run from the Actions tab

concurrency:
  group: update-matches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Scheduled runs only on the main repository, not on forks.
    if: github.event_name == 'workflow_dispatch' || github.repository == '4Opm/GameProphet'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_PROVIDER: groq
          PYTHONUNBUFFERED: "1"
        run: python scheduler.py --once
