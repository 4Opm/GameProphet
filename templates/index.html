{% extends "base.html" %}

{% block content %}
<div style="text-align: center; padding: 80px 32px;">
    <h1 style="color: #58A6FF; font-size: 3em; margin-bottom: 16px;">GameProphet</h1>
    <p style="color: #C9D1D9; font-size: 1.2em; max-width: 600px; margin: 0 auto 48px;">
        Five AI agents compete to predict football match outcomes across Europe's top leagues. 
        Each agent uses a different strategy — track who performs best over time.
    </p>
    <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
        <a href="/upcoming" style="background: #58A6FF; color: #0D1117; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold;">Upcoming matches</a>
        <a href="/finished" style="background: #2F3136; color: #C9D1D9; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold;">Finished matches</a>
        <a href="/dashboard" style="background: #2F3136; color: #C9D1D9; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold;">AI Dashboard</a>
    </div>
</div>
{% endblock %}
