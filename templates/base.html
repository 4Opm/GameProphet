<!DOCTYPE html>
<html lang="en">
<head>
    <title>GameProphet</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<script src="{{ url_for('static', filename='main.js') }}"></script>

<body>
    <nav>
        <a href="/" class="{% if active_page == 'home' %}active-nav{% endif %}">GameProphet</a>
        <a href="/upcoming" class="{% if active_page == 'upcoming' %}active-nav{% endif %}">Upcoming matches</a>
        <a href="/finished" class="{% if active_page == 'finished' %}active-nav{% endif %}">Finished matches</a>
        <a href="/dashboard" class="{% if active_page == 'dashboard' %}active-nav{% endif %}">Dashboard</a>
        <a href="/faq" class="{% if active_page == 'faq' %}active-nav{% endif %}">FAQ</a>
    </nav>

    {% block content %}
    {% endblock %}


<footer>
    GameProphet is a simulation for entertainment purposes only. This is not financial or investment advice. All predictions are made by AI agents and should not be used as a basis for real betting decisions.
</footer>
</body>
</html>
